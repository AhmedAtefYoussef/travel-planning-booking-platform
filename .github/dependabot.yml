version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major upgrades are planned deliberately between milestones, not mid-sprint.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps-dev)
    groups:
      repo-tooling:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
