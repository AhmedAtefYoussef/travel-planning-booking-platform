name: Release

# Publishes a GitHub release when the team leader pushes a v* tag on main (TRVL-136, e.g. v1.0.0-m1).
# The notes are generated from the merged PR titles since the previous tag (Conventional Commits plus
# requirement IDs), and the Swagger contract (openapi.json) is attached for graders.
# Run it by hand (Actions > Release > Run workflow) to preview the notes for any ref without publishing.
# This workflow never pushes to a branch, so the "only the team leader merges" ruleset does not affect it.
#
# Trust: the preview job may run code from any branch, so it gets a read-only token and no stored
# credentials. Only the publish job holds contents: write, only for tags on protected main, and the token
# reaches only its final `gh release` step (checkout does not persist it, so npm scripts cannot read it).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to preview notes for (nothing is published)'
        required: true
        default: develop

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    name: preview
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview release notes (nothing is published)
        env:
          TITLE: preview of ${{ inputs.ref }}
        run: node .github/scripts/release-notes.mjs HEAD --title "$TITLE" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: A release tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Merge develop into main first, then tag main."
            exit 1
          fi

      - name: Generate release notes from merged PRs
        run: |
          node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - name: Build the backend and its OpenAPI document
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm run openapi:generate

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" backend/openapi.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
